<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img"><title>Furkan Akduman, Applied AI and Automation</title><rect width="1200" height="250" rx="14" fill="#0b2545"/><text x="56.0" y="66.0" fill="#a9c8ec" font-size="24" font-weight="600" text-anchor="start">Applied AI &amp; Automation</text><text x="53.0" y="128.0" fill="#f5f8fc" font-size="60" font-weight="700" text-anchor="start">Furkan Akduman</text><text x="56.0" y="176.0" fill="#f5f8fc" font-size="24" font-weight="400" text-anchor="start">I build AI systems that businesses can trust: agents, automations</text><text x="56.0" y="210.0" fill="#f5f8fc" font-size="24" font-weight="400" text-anchor="start">and data products with checks, audit trails and cost control built in.</text></svg>